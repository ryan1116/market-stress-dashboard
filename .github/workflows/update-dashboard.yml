name: Update Market Stress Dashboard
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 07:30 KST Tue-Sat
  workflow_dispatch:
concurrency:
  group: market-data-update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas lxml
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python scripts/update_forward_pe.py
      - run: python scripts/update_dashboard.py
      - name: Publish collected data to Google Sheets
        if: vars.SHEETS_SYNC_ENABLED == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install google-auth requests
          python scripts/sync_sheets.py
      - name: Commit
        run: |
          git config user.name "market-stress-bot"
          git config user.email "market-stress-bot@users.noreply.github.com"
          git add data/latest.json data/history.json data/forward_pe.json
          git diff --cached --quiet || git commit -m "chore: update market regime"
          git push
