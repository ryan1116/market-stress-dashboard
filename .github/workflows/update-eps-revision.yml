name: Update EPS Revision Proxy
on:
  schedule:
    - cron: "15 23 * * 0"   # Monday 08:15 KST
  workflow_dispatch:
concurrency:
  group: market-data-update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  eps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build SPY earnings revision proxy
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python scripts/update_eps_revision.py
      - name: Refresh dashboard with new earnings signal
        run: |
          pip install pandas lxml
          python scripts/update_dashboard.py
      - name: Publish collected data to Google Sheets
        if: vars.SHEETS_SYNC_ENABLED == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install google-auth requests
          python scripts/sync_sheets.py
      - name: Commit
        run: |
          git config user.name "market-stress-bot"
          git config user.email "market-stress-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update EPS revision proxy"
          git push
